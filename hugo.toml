baseURL = 'https://lin1chun.github.io/'
title = "林1纯的地下室"

locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'

[languages]
  [languages.zh-CN]
    label = '简体中文'
    weight = 1
    hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[module]
  [[module.imports]]
    path = "github.com/D-Sketon/hugo-theme-reimu"
